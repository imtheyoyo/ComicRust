[package]
name = "comicrust-tauri"
description = "ComicRust, interface Tauri 2 (WebView2) au-dessus de comicrust-core"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "comicrust_tauri"

[[bin]]
name = "ComicRust-Tauri"
path = "src/main.rs"
# L'application n'est compilée qu'avec `--features app` (CI Windows, ou Linux avec webkit2gtk) :
# un `cargo test --all` sans les dépendances système du WebView reste vert.
required-features = ["app"]

[features]
default = []
# Application Tauri complète (fenêtre, commandes IPC).
app = ["dep:tauri", "dep:tauri-build"]
# Sert le front compilé (frontend/dist) depuis le binaire au lieu du serveur Vite :
# obligatoire pour la version livrée, absent en développement (`npm run dev`).
custom-protocol = ["app", "tauri/custom-protocol"]

[dependencies]
comicrust-core = { path = "../comicrust-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ordre naturel des numéros (2 avant 10), comme le tri de la version egui.
natord = "1.0"
# Miniatures de couvertures et pages du lecteur (mêmes formats que le cœur ; JPEG/PNG en sortie).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
# Dates de lecture écrites dans la base ComicRack (`Opened`), comme le cœur.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
# Base MySQL de test (COMICRUST_TEST_MYSQL) : tables de ComicRack créées par les tests.
mysql = { version = "28", default-features = false, features = ["default-rust", "client_ed25519"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
