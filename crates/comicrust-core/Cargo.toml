[package]
name = "comicrust-core"
description = "Modèle de données et formats ComicRack (ComicInfo.xml, CBZ, CBL, ComicDB.xml)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
quick-xml = { version = "0.41", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["bzip2", "deflate", "deflate64", "lzma", "zstd"] }
thiserror = "2"
natord = "1.0"
regex = "1"
fancy-regex = "0.14"
url = "2"
unrar-ng = { version = "0.7", default-features = false }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "ppmd", "util"] }
tar = "0.4"
djvu-rs = "0.43"
jxl-oxide = "0.12"
# HEIF / AVIF (pur Rust ; HEIC aussi par le décodeur de Windows, voir providers/heif.rs)
oxideav-avif = "0.0.16"
heif-oxide = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "rayon"] }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "image_latest", "thread_safe"] }
ureq = "3"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rayon = "1"
mysql = { version = "28", default-features = false, features = ["default-rust", "client_ed25519"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v5"] }
# Identité physique d'un fichier ou dossier (volume + index sous Windows, dev + inode
# ailleurs) : reconnaître `Z:\BD` et `\\SERVEURNAS\BD` comme le même dossier.
same-file = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Imaging", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Renommage sans remplacement (`renameat2(RENAME_NOREPLACE)`, voir edit/files.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
