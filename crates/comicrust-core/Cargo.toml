[package]
name = "comicrust-core"
description = "Modèle de données et formats ComicRack (ComicInfo.xml, CBZ, CBL, ComicDB.xml)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["bzip2", "deflate", "deflate64", "lzma", "zstd"] }
thiserror = "2"
natord = "1.0"
regex = "1"
unrar-ng = { version = "0.7", default-features = false }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "ppmd", "util"] }
tar = "0.4"
djvu-rs = "0.43"
jxl-oxide = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "rayon"] }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "image_latest", "thread_safe"] }
ureq = "3"
serde_json = "1"
rayon = "1"
mysql = { version = "28", default-features = false, features = ["default-rust", "client_ed25519"] }

[dev-dependencies]
tempfile = "3"
