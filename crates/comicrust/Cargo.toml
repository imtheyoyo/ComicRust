[package]
description = "ComicRust — lecteur et gestionnaire de BD (portage Rust de ComicRack)"
name = "comicrust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
comicrust-core = { version = "0.10.1", path = "../comicrust-core" }
eframe = { version = "0.37", features = ["persistence"] }
egui_extras = { version = "0.37", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
natord = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3", features = ["platform-verifier", "win-system-proxy"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "ComicRust"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[package.metadata.winresource]
ProductName = "ComicRust"
FileDescription = "ComicRust — lecteur de BD"
LegalCopyright = "GPL-2.0-or-later"
