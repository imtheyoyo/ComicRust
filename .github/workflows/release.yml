name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à créer/reconstruire depuis la branche choisie, ex. v0.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc
  PDFIUM_TAG: chromium/8111

jobs:
  windows-x64:
    name: Windows 11 x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Document de recette présent
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          test -f "recette/$tag.md" || { echo "::error::recette/$tag.md manquant : rédiger la recette avant de publier"; exit 1; }

      - name: Notes de version (CHANGELOG.md)
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          # Échoue si CHANGELOG.md n'a pas de section pour cette version.
          scripts/notes_de_version.sh "$tag" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2

      - name: PDFium (lecture des PDF)
        shell: bash
        run: |
          mkdir -p pdfium
          curl -sSfL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-win-x64.tgz"
          tar -xzf pdfium.tgz -C pdfium
          echo "PDFIUM_DYNAMIC_LIB_PATH=$(cygpath -w "$PWD/pdfium/bin")" >> "$GITHUB_ENV"
          ls pdfium/bin

      - name: Python embarqué (téléchargement et vérification SHA-256)
        shell: pwsh
        # Version et empreinte figées dans .github/python-embarque.env ; définit
        # COMICRUST_PYTHON : les tests des scripts d'exemple tournent avec ce Python.
        run: ./scripts/python_embarque.ps1 -Destination python-embed

      - name: Tests
        run: cargo test --all --target $env:TARGET

      - name: Compilation release
        run: cargo build --release --locked --target $env:TARGET -p comicrust -p comicrust-cli

      - name: Empaquetage
        id: pkg
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          $name = "ComicRust-$tag-windows-x64"
          $out = "target/$env:TARGET/release"
          New-Item -ItemType Directory -Force "$name/licences" | Out-Null
          Copy-Item "$out/ComicRust.exe", "$out/comicrust-cli.exe", "pdfium/bin/pdfium.dll" $name
          Copy-Item README.md, docs/INVENTAIRE_REA.md, docs/scripts.md $name
          Copy-Item "recette/$tag.md" "$name/RECETTE.md"
          Compress-Archive -Path "recette/echantillons/*" -DestinationPath "ComicRust-echantillons.zip" -Force
          Copy-Item pdfium/LICENSE "$name/licences/PDFium-LICENSE.txt"
          Copy-Item licences/* "$name/licences/"
          # Python embarqué (distribution officielle « embeddable », vérifiée plus haut) et
          # sa licence (PSF).
          Copy-Item -Recurse python-embed "$name/python"
          Copy-Item python-embed/LICENSE.txt "$name/licences/Python-LICENSE.txt"
          # Dossier scripts\ du paquet (même disposition que scripts-exemples/) : exemples dans
          # scripts\exemples\ (la mise à jour intégrée ne touche pas aux scripts de
          # l'utilisateur, à la racine), scripts\lib\ avec son LISEZMOI, README.md.
          New-Item -ItemType Directory -Force "$name/scripts" | Out-Null
          Copy-Item -Recurse scripts-exemples/* "$name/scripts/"
          if (-not (Test-Path "$name/scripts/exemples/nettoyage.py")) { throw "scripts\exemples\ absent du paquet" }
          Get-ChildItem "$name/scripts" -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "zip=$name.zip" >> $env:GITHUB_OUTPUT

      - name: Essai du paquet (Python embarqué et scripts d'exemple)
        shell: pwsh
        run: |
          $name = "${{ steps.pkg.outputs.name }}"
          $py = (Resolve-Path "$name/python/python.exe").Path
          # Modules natifs de la distribution (SSL, SQLite…).
          & $py -I -c "import ssl, json, urllib.request, sqlite3, zipfile, lzma, bz2, ctypes; print(ssl.OPENSSL_VERSION, '- SQLite', sqlite3.sqlite_version)"
          if ($LASTEXITCODE -ne 0) { throw "Python embarqué : modules natifs indisponibles" }
          # HTTPS avec les certificats du magasin Windows (comme les scripts Comic Vine).
          & $py -I -c "import ssl, urllib.request as u; r = u.urlopen(u.Request('https://api.github.com/', headers={'User-Agent': 'ComicRust-CI'}), timeout=30, context=ssl.create_default_context()); print('HTTPS', r.status)"
          if ($LASTEXITCODE -ne 0) { throw "Python embarqué : HTTPS en échec" }
          # Scripts d'exemple du paquet, exécutés par l'hôte de scripts avec ce Python
          # (le CLI n'exécute pas de scripts : test Rust tests/scripts_exemples.rs).
          $env:COMICRUST_PYTHON = $py
          $env:COMICRUST_EXIGER_PYTHON = "1"
          $env:COMICRUST_DOSSIER_EXEMPLES = (Resolve-Path "$name/scripts").Path
          cargo test --target $env:TARGET -p comicrust-core --test scripts_exemples
          if ($LASTEXITCODE -ne 0) { throw "scripts d'exemple en échec avec le Python du paquet" }
          Get-ChildItem "$name/scripts" -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force

      - name: Archive zip
        shell: pwsh
        run: |
          $name = "${{ steps.pkg.outputs.name }}"
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Publication de la release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ComicRust ${{ steps.pkg.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: false
          prerelease: ${{ startsWith(steps.pkg.outputs.tag, 'v0.') }}
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256
            recette/${{ steps.pkg.outputs.tag }}.md
            ComicRust-echantillons.zip
