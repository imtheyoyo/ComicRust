name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Binaire PDFium utilisé pour les tests PDF (même version que la release).
  PDFIUM_TAG: chromium/8111

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pdfium: pdfium-win-x64.tgz
            lib: bin
          - os: ubuntu-latest
            pdfium: pdfium-linux-x64.tgz
            lib: lib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: PDFium
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          # Chemins relatifs : le tar de Git Bash prend « D:\… » pour « hôte:chemin ».
          mkdir -p pdfium
          curl -sSfL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/${{ matrix.pdfium }}"
          tar -xzf pdfium.tgz -C pdfium
          dir="$PWD/pdfium/${{ matrix.lib }}"
          if command -v cygpath >/dev/null; then dir=$(cygpath -w "$dir"); fi
          echo "PDFIUM_DYNAMIC_LIB_PATH=$dir" >> "$GITHUB_ENV"
          ls "pdfium/${{ matrix.lib }}"

      - name: MySQL de test (Linux)
        if: runner.os == 'Linux'
        run: |
          # MySQL 8 est préinstallé sur les runners Ubuntu (root/root).
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE comicrust_test; CREATE USER 'testeur'@'localhost' IDENTIFIED BY 'T3st;pw'; GRANT ALL ON comicrust_test.* TO 'testeur'@'localhost';"
          echo "COMICRUST_TEST_MYSQL=Server=127.0.0.1; Port=3306; Uid=testeur; Pwd='T3st;pw'; Database=comicrust_test" >> "$GITHUB_ENV"

      - run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: |
          # Chaque avertissement devient une annotation (lisible sans télécharger les journaux).
          set +e
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          grep -E '(^|: )(error|warning)' clippy.log | head -30 | while read -r l; do echo "::error::$l"; done
          exit $status
      - run: cargo test --all
