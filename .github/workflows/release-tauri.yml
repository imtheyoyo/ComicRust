name: Release Tauri

# Version Tauri 2 de ComicRust (branche tauri2-web). Indépendante de release.yml (tags vX.Y.Z,
# interface egui) : ici les tags sont `tauri-vX.Y.Z`. Paquet portable uniquement : un zip avec
# l'exécutable, aucun installateur MSI/NSIS, aucune écriture hors du dossier (WebView2 du
# système, profil redirigé vers data\webview2).
on:
  push:
    tags: ["tauri-v*"]
    # Le proxy de développement interdit de pousser des tags : on publie en poussant sur la branche un
    # fichier `.github/release-tauri.tag` contenant le tag voulu (ex. tauri-v0.2.0). L'action de
    # publication crée alors le tag sur le commit.
    branches: ["tauri2-web"]
    paths: [".github/release-tauri.tag"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à créer/reconstruire depuis la branche choisie, ex. tauri-v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc
  PDFIUM_TAG: chromium/8111

jobs:
  windows-x64:
    name: Windows 11 x64 (portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Déterminer le tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then t="${{ github.event.inputs.tag }}";
          elif [ "${{ github.ref_type }}" = "tag" ]; then t="${{ github.ref_name }}";
          else t=$(tr -d '[:space:]' < .github/release-tauri.tag); fi
          echo "TAG=$t" >> "$GITHUB_ENV"

      - name: Tag, recette et notes de version
        shell: bash
        run: |
          tag="$TAG"
          case "$tag" in tauri-v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::tag « $tag » attendu sous la forme tauri-vX.Y.Z"; exit 1;; esac
          test -f "recette/$tag.md" || { echo "::error::recette/$tag.md manquant : rédiger la recette avant de publier"; exit 1; }
          # Le numéro du tag doit être celui de la crate (affiché dans l'application).
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/comicrust-tauri/Cargo.toml | head -1)
          test "tauri-v$crate" = "$tag" || { echo "::error::crates/comicrust-tauri/Cargo.toml est en $crate, le tag est $tag"; exit 1; }
          # Échoue si CHANGELOG.md n'a pas de section « ## [tauri-vX.Y.Z] ».
          scripts/notes_de_version.sh "$tag" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Front (Svelte + Vite)
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: PDFium (lecture des PDF, livré à côté de l'exécutable)
        shell: bash
        run: |
          mkdir -p pdfium
          curl -sSfL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-win-x64.tgz"
          tar -xzf pdfium.tgz -C pdfium
          echo "PDFIUM_DYNAMIC_LIB_PATH=$(cygpath -w "$PWD/pdfium/bin")" >> "$GITHUB_ENV"

      - name: Clippy et tests de la crate Tauri
        run: |
          cargo clippy --locked --target $env:TARGET -p comicrust-tauri --features app --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "clippy en échec" }
          cargo test --locked --target $env:TARGET -p comicrust-tauri --features app
          if ($LASTEXITCODE -ne 0) { throw "tests en échec" }

      - name: Compilation release
        # custom-protocol : le front compilé (frontend/dist) est embarqué dans l'exécutable.
        run: cargo build --release --locked --target $env:TARGET -p comicrust-tauri --features app,custom-protocol

      - name: Empaquetage (zip portable, sans installateur)
        id: pkg
        shell: pwsh
        run: |
          $tag = "$env:TAG"
          $name = "ComicRust-Tauri-$tag-windows-x64"
          $out = "target/$env:TARGET/release"
          New-Item -ItemType Directory -Force "$name/licences" | Out-Null
          Copy-Item "$out/ComicRust-Tauri.exe", "pdfium/bin/pdfium.dll" $name
          Copy-Item README.md $name
          Copy-Item "recette/$tag.md" "$name/RECETTE.md"
          Copy-Item pdfium/LICENSE "$name/licences/PDFium-LICENSE.txt"
          Copy-Item licences/* "$name/licences/"
          # Le dossier data\ (réglages, thèmes, profil WebView2) est créé au premier lancement.
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "zip=$name.zip" >> $env:GITHUB_OUTPUT

      - name: Publication de la release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ComicRust (Tauri) ${{ steps.pkg.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: false
          prerelease: true
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256
            recette/${{ steps.pkg.outputs.tag }}.md
