[workspace]
resolver = "2"
members = ["crates/comicrust-core", "crates/comicrust", "crates/comicrust-cli", "crates/comicrust-tauri", "crates/egui-mcp"]
# `cargo build` / `cargo run` sans `-p` ignorent la version Tauri (WebView, dépendances système).
# `cargo test --all` et clippy la compilent quand même, mais sans la fonction `app` (voir sa
# Cargo.toml) : la logique testable reste vérifiée sans webkit2gtk.
default-members = ["crates/comicrust-core", "crates/comicrust", "crates/comicrust-cli"]

[workspace.package]
version = "0.10.9"
edition = "2021"
license = "GPL-2.0-or-later"
repository = "https://github.com/imtheyoyo/ComicRust"

# Version livrée : optimisation inter-crates (exe plus petit et plus rapide). `panic = "unwind"`
# est gardé (valeur par défaut) : les décodeurs d'images et le pool des couvertures rattrapent
# les paniques (`catch_unwind`).
[profile.release]
lto = "thin"
codegen-units = 1
